name: Build OHOS Tools (make, bash)

on:
  workflow_run:
    workflows: ["Build GCC Cross-Compiler for OpenHarmony"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Run ID of the build workflow to use for cross-compiler'
        required: false
      target:
        description: 'Target triplet (leave empty for all)'
        required: false
        default: ''

env:
  GCC_VERSION: '15.2.0'
  MAKE_VERSION: '4.4.1'
  BASH_VERSION: '5.2.32'
  NCURSES_VERSION: '6.4'

jobs:
  build-tools:
    name: Build Tools for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-ohos
          - aarch64-linux-ohos
        include:
          - target: x86_64-linux-ohos
            runner: ubuntu-24.04
            arch: x86_64
          - target: aarch64-linux-ohos
            runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download cross-compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: gcc-cross-${{ matrix.target }}
          path: toolchain-archive
          run-id: ${{ github.event.workflow_run.id || inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Extract cross-compiler
        run: |
          mkdir -p install
          if [ -f "toolchain-archive/gcc-${{ env.GCC_VERSION }}-cross-${{ matrix.target }}.tar.xz" ]; then
            echo "Found expected artifact file"
            tar -xJf "toolchain-archive/gcc-${{ env.GCC_VERSION }}-cross-${{ matrix.target }}.tar.xz" -C install --strip-components=1
          elif ls toolchain-archive/*.tar.xz 1>/dev/null 2>&1; then
            echo "Using fallback: extracting first tarball found"
            tar -xJf toolchain-archive/*.tar.xz -C install --strip-components=1
          else
            echo "::error::Cross-compiler artifact not found"
            exit 1
          fi
          
          echo "Cross-compiler extracted:"
          ls -la install/bin/ | head -10
          install/bin/${{ matrix.target }}-gcc --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl

      - name: Create build directories
        run: |
          mkdir -p downloads build-tools install-tools

      - name: Download tool sources
        run: |
          cd downloads
          wget -q "https://ftp.gnu.org/gnu/make/make-${{ env.MAKE_VERSION }}.tar.gz"
          wget -q "https://ftp.gnu.org/gnu/bash/bash-${{ env.BASH_VERSION }}.tar.gz"
          wget -q "https://ftp.gnu.org/gnu/ncurses/ncurses-${{ env.NCURSES_VERSION }}.tar.gz"

      - name: Extract sources
        run: |
          cd build-tools
          tar -xzf ../downloads/make-${{ env.MAKE_VERSION }}.tar.gz
          tar -xzf ../downloads/bash-${{ env.BASH_VERSION }}.tar.gz
          tar -xzf ../downloads/ncurses-${{ env.NCURSES_VERSION }}.tar.gz

      - name: Update config.sub for OHOS support
        run: |
          # Copy our config.sub with OHOS support to all source directories
          for dir in build-tools/make-${{ env.MAKE_VERSION }} build-tools/bash-${{ env.BASH_VERSION }} build-tools/ncurses-${{ env.NCURSES_VERSION }}; do
            find "$dir" -name "config.sub" -type f | while read -r file; do
              cp config/config.sub "$file"
              echo "Updated: $file"
            done
          done

      - name: Patch make for OHOS compatibility
        run: |
          cd build-tools/make-${{ env.MAKE_VERSION }}
          # Fix K&R style function declarations that conflict with OHOS headers
          find . -name "*.c" -o -name "*.h" | xargs sed -i \
            -e 's/extern char \*getenv ();/extern char *getenv (const char *);/g' \
            -e 's/extern int getopt ();/extern int getopt (int, char *const*, const char *);/g' \
            2>/dev/null || true

      - name: Build GNU Make
        run: |
          export CC="${PWD}/install/bin/${{ matrix.target }}-gcc"
          export AR="${PWD}/install/bin/${{ matrix.target }}-ar"
          export RANLIB="${PWD}/install/bin/${{ matrix.target }}-ranlib"
          export STRIP="${PWD}/install/bin/${{ matrix.target }}-strip"
          
          mkdir -p build-tools/build-make
          cd build-tools/build-make
          
          CFLAGS="-O2 -static -D_GNU_SOURCE" \
          LDFLAGS="-static" \
          CC="$CC" AR="$AR" RANLIB="$RANLIB" \
          ../make-${{ env.MAKE_VERSION }}/configure \
            --host=${{ matrix.target }} \
            --prefix="${PWD}/../../install-tools" \
            --disable-nls \
            --disable-dependency-tracking \
            --without-guile
          
          make -j$(nproc)
          make install
          
          # Strip binary
          $STRIP ../../install-tools/bin/make || true
          
          echo "=== Make built ==="
          file ../../install-tools/bin/make
          ls -lh ../../install-tools/bin/make

      - name: Build ncurses (bash dependency)
        run: |
          export CC="${PWD}/install/bin/${{ matrix.target }}-gcc"
          export CXX="${PWD}/install/bin/${{ matrix.target }}-g++"
          export AR="${PWD}/install/bin/${{ matrix.target }}-ar"
          export RANLIB="${PWD}/install/bin/${{ matrix.target }}-ranlib"
          
          mkdir -p build-tools/build-ncurses
          cd build-tools/build-ncurses
          
          CFLAGS="-O2" \
          CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" \
          ../ncurses-${{ env.NCURSES_VERSION }}/configure \
            --host=${{ matrix.target }} \
            --prefix="${PWD}/../../install-tools" \
            --without-cxx \
            --without-cxx-binding \
            --without-ada \
            --without-manpages \
            --without-progs \
            --without-tests \
            --disable-database \
            --disable-termcap \
            --with-fallbacks=vt100,vt102,xterm,xterm-256color,linux \
            --enable-termcap \
            --enable-static \
            --disable-shared \
            --with-normal
          
          make -j$(nproc)
          make install
          
          echo "=== ncurses built ==="

      - name: Build Bash
        run: |
          export CC="${PWD}/install/bin/${{ matrix.target }}-gcc"
          export AR="${PWD}/install/bin/${{ matrix.target }}-ar"
          export RANLIB="${PWD}/install/bin/${{ matrix.target }}-ranlib"
          export STRIP="${PWD}/install/bin/${{ matrix.target }}-strip"
          
          mkdir -p build-tools/build-bash
          cd build-tools/build-bash
          
          # Create config.cache for cross-compilation
          cat > config.cache << 'EOF'
          ac_cv_func_mmap_fixed_mapped=yes
          ac_cv_func_strcoll_works=yes
          ac_cv_func_working_mktime=yes
          bash_cv_func_sigsetjmp=present
          bash_cv_getcwd_malloc=yes
          bash_cv_job_control_missing=present
          bash_cv_printf_a_format=yes
          bash_cv_sys_named_pipes=present
          bash_cv_ulimit_maxfds=yes
          bash_cv_under_sys_siglist=yes
          bash_cv_unusable_rtsigs=no
          gt_cv_int_divbyzero_sigfpe=yes
          EOF
          
          CFLAGS="-O2 -static -I${PWD}/../../install-tools/include -I${PWD}/../../install-tools/include/ncurses -std=gnu89 -Wno-error" \
          LDFLAGS="-static -L${PWD}/../../install-tools/lib" \
          LIBS="-lncurses" \
          CC="$CC" AR="$AR" RANLIB="$RANLIB" \
          ../bash-${{ env.BASH_VERSION }}/configure \
            --host=${{ matrix.target }} \
            --prefix="${PWD}/../../install-tools" \
            --cache-file=config.cache \
            --enable-static-link \
            --without-bash-malloc \
            --disable-nls \
            --disable-rpath \
            --enable-readline \
            --with-curses \
            --with-installed-readline=no
          
          make -j$(nproc)
          make install
          
          # Strip binary
          $STRIP ../../install-tools/bin/bash || true
          
          echo "=== Bash built ==="
          file ../../install-tools/bin/bash
          ls -lh ../../install-tools/bin/bash

      - name: Test built tools
        run: |
          echo "=== Testing make ==="
          file install-tools/bin/make
          
          echo "=== Testing bash ==="
          file install-tools/bin/bash
          
          echo "=== Built tools summary ==="
          ls -lh install-tools/bin/

      - name: Create tools archive
        run: |
          cd install-tools
          tar -cJf "../ohos-tools-${{ matrix.target }}.tar.xz" bin/make bin/bash
          ls -lh "../ohos-tools-${{ matrix.target }}.tar.xz"

      - name: Upload tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohos-tools-${{ matrix.target }}
          path: ohos-tools-${{ matrix.target }}.tar.xz
          retention-days: 30

  summary:
    name: Build Summary
    needs: build-tools
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "=== OHOS Tools Build Summary ==="
          echo ""
          echo "Tools built:"
          echo "  - GNU Make ${{ env.MAKE_VERSION }}"
          echo "  - GNU Bash ${{ env.BASH_VERSION }}"
          echo ""
          echo "Artifacts available:"
          echo "  - ohos-tools-x86_64-linux-ohos"
          echo "  - ohos-tools-aarch64-linux-ohos"
          echo ""
          echo "To use in OpenHarmony container:"
          echo "  docker cp make CONTAINER:/bin/"
          echo "  docker cp bash CONTAINER:/bin/"
