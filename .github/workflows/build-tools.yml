name: Build OHOS Tools (gawk, make, bash, patch)

on:
  workflow_run:
    workflows: ["Build GCC Cross-Compiler for OpenHarmony"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Run ID of the build workflow to use for cross-compiler'
        required: false
      target:
        description: 'Target triplet (leave empty for all)'
        required: false
        default: ''

env:
  GCC_VERSION: '15.2.0'

jobs:
  build-tools:
    name: Build Tools for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-ohos
          - aarch64-linux-ohos
        include:
          - target: x86_64-linux-ohos
            runner: ubuntu-24.04
            arch: x86_64
          - target: aarch64-linux-ohos
            runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download cross-compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: gcc-cross-${{ matrix.target }}
          path: toolchain-archive
          run-id: ${{ github.event.workflow_run.id || inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Extract cross-compiler
        run: |
          mkdir -p install
          if [ -f "toolchain-archive/gcc-${{ env.GCC_VERSION }}-cross-${{ matrix.target }}.tar.xz" ]; then
            echo "Found expected artifact file"
            tar -xJf "toolchain-archive/gcc-${{ env.GCC_VERSION }}-cross-${{ matrix.target }}.tar.xz" -C install --strip-components=1
          elif ls toolchain-archive/*.tar.xz 1>/dev/null 2>&1; then
            echo "Using fallback: extracting first tarball found"
            tar -xJf toolchain-archive/*.tar.xz -C install --strip-components=1
          else
            echo "::error::Cross-compiler artifact not found"
            exit 1
          fi
          
          echo "Cross-compiler extracted:"
          ls -la install/bin/ | head -10
          install/bin/${{ matrix.target }}-gcc --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl xz-utils

      - name: Prepare NDK sysroot
        run: |
          # Use build.sh to download and prepare NDK sysroot
          # This provides the headers and libraries needed for cross-compilation
          ./build.sh --target=${{ matrix.target }} prepare_ndk
          
          echo "=== NDK sysroot prepared ==="
          ls -la ndk/sysroot/${{ matrix.target }}/usr/lib/ | head -10

      - name: Build all tools using build-tools.sh
        run: |
          # Use build-tools.sh to build gawk, make, bash, patch
          # It will use the cross-compiler from ./install and sysroot from ./ndk/sysroot
          ./build-tools.sh --target=${{ matrix.target }} --stage1=./install all
          
          echo "=== Built tools ==="
          ls -lh install-tools/bin/

      - name: Test built tools
        run: |
          echo "=== Testing tools ==="
          for tool in gawk awk make bash patch; do
            if [ -f "install-tools/bin/$tool" ]; then
              echo "--- $tool ---"
              file "install-tools/bin/$tool"
            fi
          done
          
          echo "=== Built tools summary ==="
          ls -lh install-tools/bin/

      - name: Create tools archive
        run: |
          cd install-tools
          # Archive all built binaries
          tar -cJf "../ohos-tools-${{ matrix.target }}.tar.xz" bin/
          ls -lh "../ohos-tools-${{ matrix.target }}.tar.xz"

      - name: Upload tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohos-tools-${{ matrix.target }}
          path: ohos-tools-${{ matrix.target }}.tar.xz
          retention-days: 30

  summary:
    name: Build Summary
    needs: build-tools
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "=== OHOS Tools Build Summary ==="
          echo ""
          echo "Tools built using build-tools.sh:"
          echo "  - GNU Awk (gawk)"
          echo "  - GNU Make"
          echo "  - GNU Bash"
          echo "  - GNU Patch"
          echo ""
          echo "Artifacts available:"
          echo "  - ohos-tools-x86_64-linux-ohos"
          echo "  - ohos-tools-aarch64-linux-ohos"
          echo ""
          echo "To use in OpenHarmony container:"
          echo "  docker cp gawk CONTAINER:/usr/bin/"
          echo "  docker cp make CONTAINER:/usr/bin/"
          echo "  docker cp bash CONTAINER:/bin/"
          echo "  docker cp patch CONTAINER:/usr/bin/"
