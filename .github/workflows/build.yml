name: Build GCC Cross-Compiler for OpenHarmony

on:
  push:
    branches: [ main, develop, 'release/*', 'hotfix/*', 'feature/*' ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target triplet (e.g., x86_64-linux-ohos)'
        required: false
        default: 'x86_64-linux-ohos'
      build_native:
        description: 'Build native OHOS compiler (Canadian Cross)'
        required: false
        default: 'true'
      build_bootstrap:
        description: 'Build Stage 3 bootstrap (self-hosting)'
        required: false
        default: 'true'
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'

env:
  # NDK download URL - update this when new versions are released
  NDK_URL: 'https://cidownload.openharmony.cn/version/Daily_Version/LLVM-19/20260114_061434/version-Daily_Version-LLVM-19-20260114_061434-LLVM-19.tar.gz'
  GCC_VERSION: '15.2.0'
  BINUTILS_VERSION: '2.43'
  # Enable verbose output for debugging
  DEBUG_BUILD: ${{ github.event.inputs.debug == 'true' && '1' || '' }}

jobs:
  # Stage 1: Build cross-compiler (runs on Linux, compiles for OHOS)
  build-cross:
    name: Stage 1 - Cross Compiler ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Require manual approval for PRs from forks
    environment: ${{ github.event_name == 'pull_request' && 'pr-approval' || '' }}
    timeout-minutes: 180
    
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-ohos
          - aarch64-linux-ohos
        include:
          - target: x86_64-linux-ohos
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-linux-ohos
            arch: aarch64
            runner: ubuntu-24.04-arm  # Native ARM64 runner

    outputs:
      x86_64-success: ${{ steps.verify.outputs.x86_64-success }}
      aarch64-success: ${{ steps.verify.outputs.aarch64-success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          
          # Remove unnecessary large packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc g++ \
            make \
            flex bison \
            texinfo \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            libisl-dev \
            zlib1g-dev \
            libzstd-dev \
            wget curl \
            tar xz-utils \
            file \
            python3 \
            autoconf automake libtool \
            pkg-config

      - name: Display build environment info
        run: |
          echo "=== Build Environment ==="
          echo "--- System info ---"
          uname -a
          cat /etc/os-release
          
          echo "--- Compiler versions ---"
          gcc --version | head -1
          g++ --version | head -1
          
          echo "--- Available compilers ---"
          which gcc g++ x86_64-linux-gnu-gcc x86_64-linux-gnu-g++ 2>/dev/null || true
          ls -la /usr/bin/*gcc* /usr/bin/*g++* 2>/dev/null || true
          
          echo "--- Memory info ---"
          free -h
          
          echo "--- CPU info ---"
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)|Thread'
          
          echo "--- Disk space ---"
          df -h

      - name: Cache NDK sysroot
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ndk/sysroot
          key: ndk-sysroot-${{ matrix.target }}-${{ hashFiles('sysroot-patches/*.patch') }}
          restore-keys: |
            ndk-sysroot-${{ matrix.target }}-

      - name: build GCC
        run: |
          echo "=== Installing GCC ==="
          # Use --relocatable-sysroot to make the toolchain distributable
          # The sysroot will be at <prefix>/<target>/sysroot
          ./build.sh --target=${{ matrix.target }} --relocatable-sysroot all 2>&1 | tee all-gcc.log || {
            echo "=== GCC INSTALL FAILED ==="
            tail -100 install-gcc.log
            exit 1
          }
          
          echo "--- Installation summary ---"
          echo "Installed files: $(find install -type f | wc -l)"
          echo "Total size: $(du -sh install | cut -f1)"
          
          # Copy sysroot to the relocatable location for distribution
          echo "--- Copying sysroot to relocatable location ---"
          SYSROOT_DST="install/${{ matrix.target }}/sysroot"
          mkdir -p "${SYSROOT_DST}"
          cp -a "ndk/sysroot/${{ matrix.target }}"/* "${SYSROOT_DST}/"
          echo "Sysroot size: $(du -sh ${SYSROOT_DST} | cut -f1)"

      - name: Verify toolchain
        id: verify
        run: |
          echo "=== Toolchain verification ==="
          export PATH="${PWD}/install/bin:${PATH}"
          
          # Check compiler version
          echo "--- GCC version ---"
          ${{ matrix.target }}-gcc --version
          
          echo "--- G++ version ---"
          ${{ matrix.target }}-g++ --version
          
          # Check binutils
          echo "--- Binutils ---"
          ${{ matrix.target }}-ld --version
          ${{ matrix.target }}-as --version
          
          # Test simple compilation
          echo "--- Test C compilation ---"
          echo 'int main() { return 0; }' > test.c
          ${{ matrix.target }}-gcc -c test.c -o test.o
          file test.o
          
          echo "--- Test C++ compilation ---"
          echo 'int main() { return 0; }' > test.cpp
          ${{ matrix.target }}-g++ -c test.cpp -o test_cpp.o
          file test_cpp.o
          
          echo "=== Verification completed ==="
          
          # Set output for dependent jobs
          if [[ "${{ matrix.target }}" == "x86_64-linux-ohos" ]]; then
            echo "x86_64-success=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.target }}" == "aarch64-linux-ohos" ]]; then
            echo "aarch64-success=true" >> $GITHUB_OUTPUT
          fi

      - name: Package cross-compiler toolchain
        run: |
          PACKAGE_NAME="gcc-${{ env.GCC_VERSION }}-cross-${{ matrix.target }}"
          mkdir -p artifacts
          
          # Create README for the package
          cat > install/README.md << 'EOF'
          # GCC Cross-Compiler for OpenHarmony
          
          This is a relocatable cross-compiler toolchain for OpenHarmony (OHOS).
          
          ## Directory Structure
          
          ```
          <install-dir>/
          ├── bin/                    # Compiler binaries
          │   ├── <target>-gcc
          │   ├── <target>-g++
          │   └── ...
          ├── lib/                    # Host libraries
          ├── libexec/                # Compiler internals
          └── <target>/
              ├── sysroot/            # Target sysroot (headers + libraries)
              │   ├── usr/include/
              │   └── usr/lib/
              └── ...
          ```
          
          ## Usage
          
          1. Extract the tarball to your desired location (e.g., `/opt/ohos-gcc`)
          2. Add `<install-dir>/bin` to your PATH
          3. Use the compiler:
             ```bash
             export PATH=/opt/ohos-gcc/bin:$PATH
             aarch64-linux-ohos-gcc -o hello hello.c
             ```
          
          The sysroot is already included and configured. No additional setup needed.
          EOF
          
          # Create tarball (includes sysroot)
          tar -cJf "artifacts/${PACKAGE_NAME}.tar.xz" -C install .
          
          # Generate checksums
          cd artifacts
          sha256sum "${PACKAGE_NAME}.tar.xz" > "${PACKAGE_NAME}.tar.xz.sha256"

      - name: Upload cross-compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-cross-${{ matrix.target }}
          path: artifacts/
          retention-days: 30

      - name: Upload stage 1 install for Canadian Cross
        uses: actions/upload-artifact@v4
        with:
          name: stage1-${{ matrix.target }}
          path: install/
          retention-days: 1

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-stage1-${{ matrix.target }}
          path: |
            *.log
            build-ohos/config.log
            build-binutils/config.log
          retention-days: 7

  # Stage 2: Build native OHOS compiler (Canadian Cross)
  build-native:
    name: Stage 2 - Native OHOS Compiler ${{ matrix.target }}
    needs: build-cross
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    # Build native compiler unless explicitly disabled via workflow_dispatch
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_native != 'false' }}
    
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-ohos
          - aarch64-linux-ohos
        include:
          - target: x86_64-linux-ohos
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-linux-ohos
            arch: aarch64
            runner: ubuntu-24.04-arm  # Native ARM64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          
          # Remove unnecessary large packages
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/go
          
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc g++ \
            make \
            flex bison \
            texinfo \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            libisl-dev \
            zlib1g-dev \
            libzstd-dev \
            wget curl \
            tar xz-utils \
            file \
            python3 \
            autoconf automake libtool \
            pkg-config

      - name: Display Stage 2 build environment info
        run: |
          echo "=== Stage 2 Build Environment ==="
          echo "--- System info ---"
          uname -a
          
          echo "--- Compiler versions ---"
          gcc --version | head -1
          g++ --version | head -1
          
          echo "--- Available build compilers ---"
          echo "Checking x86_64-linux-gnu-gcc:"
          which x86_64-linux-gnu-gcc 2>/dev/null && x86_64-linux-gnu-gcc --version | head -1 || echo "  Not found"
          echo "Checking gcc:"
          which gcc && gcc --version | head -1
          
          echo "--- All available compilers ---"
          ls -la /usr/bin/*gcc* 2>/dev/null || true
          
          echo "--- Memory & Disk ---"
          free -h
          df -h

      - name: Download stage 1 cross-compiler
        uses: actions/download-artifact@v4
        with:
          name: stage1-${{ matrix.target }}
          path: install/

      - name: Verify stage 1 artifact extraction
        run: |
          echo "=== Verifying Stage 1 Artifact ==="
          
          echo "--- Directory structure ---"
          ls -la install/
          ls -la install/bin/ | head -20
          
          echo "--- File count ---"
          echo "Total files: $(find install -type f | wc -l)"
          echo "Binaries: $(find install/bin -type f | wc -l)"
          
          echo "--- Critical files check ---"
          critical_files=(
            "install/bin/${{ matrix.target }}-gcc"
            "install/bin/${{ matrix.target }}-g++"
            "install/bin/${{ matrix.target }}-ld"
            "install/bin/${{ matrix.target }}-as"
            "install/bin/${{ matrix.target }}-ar"
          )
          
          all_found=true
          for f in "${critical_files[@]}"; do
            if [ -f "$f" ]; then
              echo "  ✓ Found: $f ($(stat -c%s "$f") bytes)"
            else
              echo "  ✗ MISSING: $f"
              all_found=false
            fi
          done
          
          if [ "$all_found" != "true" ]; then
            echo "ERROR: Critical files missing from stage 1 artifact!"
            exit 1
          fi
          
          echo "--- libexec check ---"
          ls -la install/libexec/gcc/${{ matrix.target }}/ 2>/dev/null || echo "libexec directory structure may differ"

      - name: Make stage 1 tools executable
        run: |
          echo "=== Making Stage 1 Tools Executable ==="
          chmod +x install/bin/*
          chmod +x install/libexec/gcc/${{ matrix.target }}/*/* || true
          
          # Verify permissions
          echo "--- Verifying executable permissions ---"
          ls -la install/bin/${{ matrix.target }}-gcc
          
          # Add stage 1 to PATH and verify
          export PATH="${PWD}/install/bin:${PATH}"
          
          echo "--- Stage 1 GCC verification ---"
          echo "GCC location: $(which ${{ matrix.target }}-gcc)"
          ${{ matrix.target }}-gcc --version
          
          echo "--- Testing stage 1 compiler ---"
          echo 'int main() { return 0; }' > /tmp/test.c
          ${{ matrix.target }}-gcc -c /tmp/test.c -o /tmp/test.o && echo "  ✓ Stage 1 compiler works" || echo "  ✗ Stage 1 compiler failed"
          file /tmp/test.o

      - name: Build Canadian Cross (Stage 2)
        run: |
          set -o pipefail  # Ensure pipeline returns the exit code of the failed command
          
          echo "=== Building native OHOS compiler (Canadian Cross) ==="
          echo "Build configuration:"
          echo "  CBUILD: x86_64-linux-gnu"
          echo "  CHOST: ${{ matrix.target }}"
          echo "  CTARGET: ${{ matrix.target }}"
          echo "  Stage 1: ./install"
          echo "  Prefix: /usr (will be installed to ./install-stage2 with DESTDIR)"
          echo "  Jobs: $(nproc)"
          echo ""
          
          # Ensure clean build directory
          rm -rf build-ohos build-binutils
          
          # Build with --prefix=/usr so paths are correct when installed in OHOS container
          # The actual files go to ./install-stage2 via DESTDIR mechanism in build.sh
          if ! ./build.sh \
            --host=${{ matrix.target }} \
            --target=${{ matrix.target }} \
            --stage1=./install \
            --prefix=/usr \
            --destdir=./install-stage2 \
            --jobs=$(nproc) \
            all 2>&1 | tee build-stage2.log; then
              echo "=== BUILD FAILED - Last 200 lines of log ==="
              tail -200 build-stage2.log
              echo "=== Checking for configure errors ==="
              grep -n -i "error\|failed\|cannot\|not found" build-stage2.log | tail -50 || true
              echo "=== Checking CC_FOR_BUILD usage ==="
              grep -n "CC_FOR_BUILD\|checking build system compiler" build-stage2.log | tail -20 || true
              exit 1
          fi

      - name: Verify native compiler binaries
        run: |
          echo "=== Verifying native OHOS compiler ==="
          
          # With --prefix=/usr --destdir=./install-stage2, files are in ./install-stage2/usr/
          STAGE2_ROOT="./install-stage2/usr"
          
          # Check that install directory exists and has content
          if [ ! -d "${STAGE2_ROOT}/bin" ]; then
            echo "ERROR: ${STAGE2_ROOT}/bin directory not found!"
            echo "Directory listing:"
            ls -laR ./install-stage2/ 2>/dev/null | head -50 || echo "install-stage2 does not exist"
            exit 1
          fi
          
          # Check critical binaries exist
          echo "--- Critical binary check ---"
          critical_bins=("gcc" "g++" "cpp")
          for bin in "${critical_bins[@]}"; do
            if [ -f "${STAGE2_ROOT}/bin/$bin" ]; then
              echo "  ✓ $bin: $(stat -c%s ${STAGE2_ROOT}/bin/$bin) bytes"
            else
              echo "  ✗ MISSING: $bin"
            fi
          done
          
          # Check that binaries are OHOS format
          echo "--- Binary format check ---"
          file ${STAGE2_ROOT}/bin/gcc
          file ${STAGE2_ROOT}/bin/g++
          
          # Verify it's an ELF for the right architecture
          echo "--- Architecture verification ---"
          readelf -h ${STAGE2_ROOT}/bin/gcc | grep -E 'Class|Machine|OS/ABI' || true
          
          # Verify interpreter is musl
          echo "--- Interpreter check ---"
          readelf -p .interp ${STAGE2_ROOT}/bin/gcc || true
          
          # Check dynamic dependencies
          echo "--- Dynamic dependencies ---"
          readelf -d ${STAGE2_ROOT}/bin/gcc | grep NEEDED || true
          
          # List installed files
          echo "--- Installed binaries ---"
          ls -la ${STAGE2_ROOT}/bin/
          
          # Count total installed files
          echo "--- Installation statistics ---"
          echo "Total files: $(find ./install-stage2 -type f | wc -l)"
          echo "Total size: $(du -sh ./install-stage2 | cut -f1)"
          
          echo "=== Verification completed ==="

      - name: Package native OHOS compiler
        run: |
          PACKAGE_NAME="gcc-${{ env.GCC_VERSION }}-native-${{ matrix.target }}"
          mkdir -p artifacts
          
          # Create tarball
          tar -cJf "artifacts/${PACKAGE_NAME}.tar.xz" -C install-stage2 .
          
          # Generate checksums
          cd artifacts
          sha256sum "${PACKAGE_NAME}.tar.xz" > "${PACKAGE_NAME}.tar.xz.sha256"
          
          # Create info file
          cat > "${PACKAGE_NAME}.info" << EOF
          Package: GCC Native Compiler for OpenHarmony
          GCC Version: ${{ env.GCC_VERSION }}
          Binutils Version: ${{ env.BINUTILS_VERSION }}
          Target: ${{ matrix.target }}
          Build Type: Canadian Cross (Stage 2)
          Build Date: $(date -u +%Y-%m-%d)
          Description: Native GCC compiler that runs on OHOS and compiles for OHOS
          EOF

      - name: Upload native compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-native-${{ matrix.target }}
          path: artifacts/
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-stage2-${{ matrix.target }}
          path: |
            *.log
            build-ohos/config.log
            build-ohos/gcc/config.log
            build-ohos/gmp/config.log
            build-binutils/config.log
          retention-days: 7

      - name: Package stage 2 for bootstrap
        run: |
          echo "=== Creating tar archive for Stage 3 ==="
          tar -cf stage2-${{ matrix.target }}.tar -C install-stage2 .
          ls -lh stage2-${{ matrix.target }}.tar

      - name: Upload stage 2 install for Stage 3 bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: stage2-${{ matrix.target }}
          path: stage2-${{ matrix.target }}.tar
          retention-days: 1

  # Build tools (gawk, make, bash, patch) needed for Stage 3
  build-tools:
    name: Build Tools for ${{ matrix.target }}
    needs: build-cross
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_native != 'false' }}
    
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-ohos
          - aarch64-linux-ohos
        include:
          - target: x86_64-linux-ohos
            runner: ubuntu-24.04
            arch: x86_64
          - target: aarch64-linux-ohos
            runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl xz-utils build-essential

      - name: Download stage 1 cross-compiler
        uses: actions/download-artifact@v4
        with:
          name: stage1-${{ matrix.target }}
          path: install/

      - name: Make stage 1 tools executable
        run: |
          chmod +x install/bin/*
          chmod +x install/libexec/gcc/${{ matrix.target }}/*/* || true
          export PATH="${PWD}/install/bin:${PATH}"
          ${{ matrix.target }}-gcc --version

      - name: Prepare NDK sysroot
        run: |
          ./build.sh --target=${{ matrix.target }} prepare_ndk
          echo "=== NDK sysroot prepared ==="
          ls -la ndk/sysroot/${{ matrix.target }}/usr/lib/ | head -10

      - name: Build all tools using build-tools.sh
        run: |
          ./build-tools.sh --target=${{ matrix.target }} --stage1=./install all
          echo "=== Built tools ==="
          ls -lh install-tools/bin/

      - name: Package tools for Stage 3
        run: |
          echo "=== Creating tar archive for Stage 3 ==="
          tar -cf ohos-tools-${{ matrix.target }}.tar -C install-tools .
          ls -lh ohos-tools-${{ matrix.target }}.tar

      - name: Upload tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohos-tools-${{ matrix.target }}
          path: ohos-tools-${{ matrix.target }}.tar
          retention-days: 1

  # Stage 3: Bootstrap build (runs inside OHOS container)
  build-bootstrap:
    name: Stage 3 - Bootstrap ${{ matrix.target }}
    needs: [build-native, build-tools]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_bootstrap != 'false' }}
    
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-ohos
          - aarch64-linux-ohos
        include:
          - target: x86_64-linux-ohos
            runner: ubuntu-24.04
            arch: x86_64
            container_image: ghcr.io/sanchuanhehe/openharmony-x86_64:latest
          - target: aarch64-linux-ohos
            runner: ubuntu-24.04-arm
            arch: aarch64
            container_image: ghcr.io/sanchuanhehe/openharmony-aarch64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/go
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Download stage 2 native compiler
        uses: actions/download-artifact@v4
        with:
          name: stage2-${{ matrix.target }}

      - name: Download OHOS tools
        uses: actions/download-artifact@v4
        with:
          name: ohos-tools-${{ matrix.target }}

      - name: Verify downloaded artifacts
        run: |
          echo "=== Downloaded tar archives ==="
          ls -lh *.tar
          file *.tar

      - name: Pull OHOS container image
        run: |
          docker pull ${{ matrix.container_image }}

      - name: Prepare container environment
        run: |
          # Create a script to run inside the container
          cat > setup-container.sh << 'SETUP_EOF'
          #!/bin/sh
          set -e
          
          echo "=== Setting up OHOS container environment ==="
          
          # Install busybox symlinks
          echo "--- Installing busybox symlinks ---"
          busybox --install -s /bin
          
          # Verify essential commands
          echo "--- Verifying commands ---"
          which sh ls cp mv rm mkdir cat echo
          
          echo "=== Container setup complete ==="
          SETUP_EOF
          chmod +x setup-container.sh

      - name: Build Stage 3 (Bootstrap) in OHOS container
        run: |
          # Run the bootstrap build inside OHOS container
          # Tar archives are already downloaded from artifacts
          docker run --rm \
            -v "${PWD}:/ohos-gcc" \
            -v "${PWD}/stage2-${{ matrix.target }}.tar:/stage2.tar:ro" \
            -v "${PWD}/ohos-tools-${{ matrix.target }}.tar:/ohos-tools.tar:ro" \
            -w /ohos-gcc \
            ${{ matrix.container_image }} \
            /bin/sh -c '
              set -e
              set -o pipefail  # Ensure pipeline returns error if build.sh fails
              
              echo "=== Stage 3 Bootstrap Build ==="
              
              # Step 1: Install busybox symlinks
              echo "--- Step 1: Installing busybox symlinks ---"
              busybox --install -s /bin
              
              # Verify basic commands
              echo "Verifying basic commands..."
              which sh ls cp mv rm mkdir cat echo grep sed awk tar
              
              # Step 2: Show current filesystem layout
              echo "--- Step 2: Current filesystem layout ---"
              ls -la / | head -20
              echo "Checking symlinks:"
              for dir in lib lib64 bin sbin; do
                if [ -L "/$dir" ]; then
                  echo "  /$dir -> $(readlink /$dir)"
                elif [ -d "/$dir" ]; then
                  echo "  /$dir (directory)"
                else
                  echo "  /$dir (not exist)"
                fi
              done
              
              # Step 3: Install Stage 2 compiler to / using tar
              # tar automatically follows symlinks when extracting
              echo "--- Step 3: Installing Stage 2 compiler to / ---"
              cd /
              tar -xf /stage2.tar
              echo "Stage 2 compiler installed."
              
              # Verify Stage 2 compiler
              echo "GCC version:"
              gcc --version
              echo "G++ version:"
              g++ --version
              
              # Step 4: Install OHOS tools (gawk, make, bash, patch)
              echo "--- Step 4: Installing OHOS tools ---"
              tar -xf /ohos-tools.tar
              chmod +x /bin/gawk /bin/make /bin/bash /bin/patch 2>/dev/null || true
              
              # Verify tools
              echo "gawk version:"
              gawk --version | head -1 || echo "gawk not available"
              echo "make version:"
              make --version | head -1 || echo "make not available"
              echo "bash version:"
              bash --version | head -1 || echo "bash not available"
              
              # Return to working directory
              cd /ohos-gcc
              
              # Step 6: Test compiler before build
              echo "--- Step 6: Testing Stage 2 compiler ---"
              echo "int main() { return 0; }" > /tmp/test.c
              echo "Compiling test program with verbose output..."
              if /bin/gcc -v /tmp/test.c -o /tmp/test 2>&1; then
                echo "✓ Compiler works!"
                ls -la /tmp/test
                /tmp/test && echo "✓ Test program runs!"
              else
                echo "✗ Compiler failed to create executable"
                echo ""
                echo "--- Trying to identify the problem ---"
                echo "1. Check assembler:"
                /bin/gcc -c /tmp/test.c -o /tmp/test.o -v 2>&1 || true
                echo ""
                echo "2. Check object file:"
                ls -la /tmp/test.o 2>/dev/null || echo "No object file created"
                echo ""
                echo "3. Check linker directly:"
                /bin/ld --version 2>&1 || true
                echo ""
                echo "4. Check libc.so exists:"
                ls -la /lib/libc.so* /usr/lib/libc.so* 2>/dev/null || echo "No libc.so found"
                echo ""
                echo "5. Check ld-musl linker:"
                ls -la /lib/ld-musl* 2>/dev/null || echo "No ld-musl found"
                echo ""
                echo "6. Manual link test:"
                /bin/ld -o /tmp/test /usr/lib/crt1.o /usr/lib/crti.o /tmp/test.o -lc /usr/lib/crtn.o --dynamic-linker /lib/ld-musl-x86_64.so.1 2>&1 || true
                exit 1
              fi
              
              # Step 7: Run bootstrap build
              echo "--- Step 7: Running bootstrap build ---"
              if ! ./build.sh \
                --build=${{ matrix.target }} \
                --host=${{ matrix.target }} \
                --target=${{ matrix.target }} \
                --stage2=/ \
                --prefix=/ohos-gcc/install-stage3 \
                all 2>&1 | tee build-stage3.log; then
                echo "=== BUILD FAILED ==="
                echo ""
                echo "--- Debugging: GCC search paths ---"
                /bin/gcc -v 2>&1 || true
                /bin/gcc -print-search-dirs 2>&1 || true
                echo ""
                echo "--- Debugging: Check if crt*.o exist ---"
                ls -la /usr/lib/crt*.o 2>/dev/null || echo "No crt*.o in /usr/lib/"
                ls -la /lib/crt*.o 2>/dev/null || echo "No crt*.o in /lib/"
                echo ""
                echo "--- Debugging: Check libgcc ---"
                ls -la /lib/gcc/*/15.2.0/libgcc* 2>/dev/null || echo "No libgcc in /lib/gcc/"
                ls -la /usr/lib/gcc/*/15.2.0/libgcc* 2>/dev/null || echo "No libgcc in /usr/lib/gcc/"
                echo ""
                echo "--- Debugging: config.log compile test ---"
                if [ -f "build-binutils/config.log" ]; then
                  echo "=== build-binutils/config.log ==="
                  grep -A 50 "configure:.*checking whether the C compiler works" build-binutils/config.log || tail -300 build-binutils/config.log
                fi
                if [ -f "build-ohos/config.log" ]; then
                  echo "=== build-ohos/config.log ==="
                  grep -A 50 "configure:.*checking whether the C compiler works" build-ohos/config.log || tail -300 build-ohos/config.log
                fi
                echo ""
                echo "--- Last 100 lines of build log ---"
                tail -100 build-stage3.log
                exit 1
              fi
              
              echo "=== Stage 3 Bootstrap completed successfully ==="
            '

      - name: Verify bootstrap compiler
        run: |
          echo "=== Verifying bootstrap compiler ==="
          
          # Check if build completed
          if [ -f "build-stage3.log" ]; then
            echo "--- Build log tail ---"
            tail -50 build-stage3.log
            
            # Check for success
            if grep -q "Comparison successful" build-stage3.log; then
              echo "✓ Bootstrap comparison successful!"
            elif grep -q "Bootstrap comparison failure" build-stage3.log; then
              echo "✗ Bootstrap comparison failed!"
              exit 1
            fi
          fi

      - name: Package bootstrap compiler
        if: success()
        run: |
          PACKAGE_NAME="gcc-${{ env.GCC_VERSION }}-bootstrap-${{ matrix.target }}"
          mkdir -p artifacts
          
          # The bootstrap result is in install-stage3/ directory
          if [ -d "install-stage3" ]; then
            tar -cJf "artifacts/${PACKAGE_NAME}.tar.xz" -C install-stage3 .
            cd artifacts
            sha256sum "${PACKAGE_NAME}.tar.xz" > "${PACKAGE_NAME}.tar.xz.sha256"
          else
            echo "Warning: No install-stage3 directory found for packaging"
            ls -la
          fi

      - name: Upload bootstrap compiler artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-bootstrap-${{ matrix.target }}
          path: artifacts/
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-stage3-${{ matrix.target }}
          path: |
            *.log
            build-ohos/config.log
            build-binutils/config.log
          retention-days: 7

  # Quick syntax and patch validation (runs faster than full build)
  validate:
    name: Validate patches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate patch files
        run: |
          echo "=== Validating patch file syntax ==="
          
          for patch in gcc-patches/*.patch binutils-patches/*.patch sysroot-patches/*.patch; do
            if [ -f "$patch" ] && [ -s "$patch" ]; then
              echo "Checking: $patch"
              # Find first non-empty, non-comment line and check if it's valid diff format
              first_diff_line=$(grep -m1 -E '^(diff|From|---|\+\+\+|@@)' "$patch" || true)
              if [ -n "$first_diff_line" ]; then
                echo "  ✓ Valid patch format"
              else
                echo "  ✗ Invalid patch format - no diff headers found"
                exit 1
              fi
            fi
          done
          
          echo "=== All patches validated ==="

      - name: Check build script syntax
        run: |
          bash -n build.sh
          echo "✓ build.sh syntax OK"

  # Create release when tagged
  release:
    name: Create Release
    needs: [build-cross, build-native, build-bootstrap]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gcc-*
          merge-multiple: true

      - name: List release files
        run: |
          echo "=== Release files ==="
          ls -la artifacts/
          echo "=== Checksums ==="
          cat artifacts/*.sha256 || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.tar.xz
            artifacts/*.sha256
            artifacts/*.info
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          generate_release_notes: true
          body: |
            ## GCC ${{ env.GCC_VERSION }} for OpenHarmony
            
            This release includes:
            - **Cross-compilers**: Run on Linux, compile for OHOS
            - **Native compilers**: Run on OHOS, compile for OHOS (Canadian Cross build)
            - **Bootstrap compilers**: Self-hosted GCC built and verified on OHOS
            
            ### Packages
            
            | Package | Description |
            |---------|-------------|
            | `gcc-*-cross-*.tar.xz` | Cross-compiler (Linux host) |
            | `gcc-*-native-*.tar.xz` | Native compiler (OHOS host, Canadian Cross) |
            | `gcc-*-bootstrap-*.tar.xz` | Bootstrap compiler (OHOS self-hosted) |
            
            ### Supported Targets
            - `x86_64-linux-ohos` (x86_64)
            - `aarch64-linux-ohos` (ARM64)
            
            ### Installation
            
            ```bash
            # Cross-compiler (on Linux)
            tar -xJf gcc-*-cross-x86_64-linux-ohos.tar.xz -C /opt/ohos-gcc
            export PATH=/opt/ohos-gcc/bin:$PATH
            
            # Native compiler (on OHOS device)
            tar -xJf gcc-*-native-x86_64-linux-ohos.tar.xz -C /opt/gcc
            export PATH=/opt/gcc/bin:$PATH
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
